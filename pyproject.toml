[project]
name = "hetznerdns-to-mikrotik"
version = "0.0.0"
description = "Tool to sync Hetzner Cloud DNS records to Mikrotik routers"
authors = [{ name = "Jan Dittrich", email = "mail@jand.one" }]
readme = "README.md"
requires-python = ">=3.15"
dependencies = [
    "routeros-api>=0.21.0,<1",
    "requests>=2.34.2,<3",
    "click>=8.5.1,<9",
]

[dependency-groups]
dev = [
    "black>=26.10.1,<27",
    "pylint>=4.1.4,<5",
    "isort>=9.0.2,<10",
    "mypy>=2.4.1,<3",
    "types-requests>=2.33.0.20261030,<3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hetznerdns_to_mikrotik"]

[project.scripts]
hdns2mikrotik = "hetznerdns_to_mikrotik.cli:main"

[tool.black]
line-length = 120

[tool.pylint]
max-line-length = 120

[tool.isort]
profile = "black"
skip_gitignore = true

[tool.mypy]
exclude_gitignore = true

[[tool.mypy.overrides]]
module = ["routeros_api.*"]
ignore_missing_imports = true
